<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOT Paper 88 Quizzes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single column "official circular" card — navy letterhead band, file-tab question counter, paper sheet */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#18223a; --muted:#5b6680; --line:#d6dce8;
  --navy:#1d3263; --navy-ink:#ffffff; --seal:#b8862b; --ok:#1f7a4a; --ok-bg:#e3f4ea; --bad:#b3322c; --bad-bg:#fbe7e5; --hover:#f3f6fb;
  --display:"Merriweather",Georgia,serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --paper:#18213a; --ink:#e7ebf5; --muted:#9aa6c2; --line:#2c3857;
  --navy:#22386e; --navy-ink:#ffffff; --seal:#d9aa52; --ok:#5fd69a; --ok-bg:#183a2b; --bad:#ff8a80; --bad-bg:#43201f; --hover:#1f2a47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --paper:#18213a; --ink:#e7ebf5; --muted:#9aa6c2; --line:#2c3857;
  --navy:#22386e; --navy-ink:#ffffff; --seal:#d9aa52; --ok:#5fd69a; --ok-bg:#183a2b; --bad:#ff8a80; --bad-bg:#43201f; --hover:#1f2a47; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:20px 18px;display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--seal)}
header img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--seal);flex:none}
header .t{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:600}
h1{font-family:var(--display);font-size:clamp(20px,5vw,26px);line-height:1.2;margin:4px 0 2px;text-wrap:balance}
header p{margin:0;font-size:14px;opacity:.9}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--seal);width:0;transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.qno{font-size:13px;font-weight:700;color:var(--seal);letter-spacing:.08em;text-transform:uppercase}
.q{font-size:18px;font-weight:600;line-height:1.45;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--hover)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt:disabled{cursor:default}
.fb{font-weight:600;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;border:1.5px solid var(--navy);background:var(--navy);color:var(--navy-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{font:inherit;font-size:13px;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.grid button.bad{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.grid button.cur{outline:2px solid var(--seal);outline-offset:1px}
details summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
details .grid{margin-top:10px}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--display);font-size:48px;font-weight:900;color:var(--navy);line-height:1}
:root[data-theme="dark"] .result .big{color:var(--seal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .result .big{color:var(--seal)}}
footer{text-align:center;font-size:15px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
footer b{color:var(--ink)}

[hidden]{display:none!important}
.quizv{display:flex;flex-direction:column;gap:16px}
.list{display:flex;flex-direction:column;gap:10px}
.paper{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.paper:hover{background:var(--hover)}
.paper:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.paper .yr{flex:none;width:58px;text-align:center;font-family:var(--display);font-weight:900;font-size:20px;color:var(--navy);line-height:1.1}
.paper .yr small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--seal)}
.paper .info{min-width:0;flex:1}
.paper .nm{font-weight:700;font-size:16px}
.paper .st{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.paper .go{flex:none;font-weight:700;color:var(--seal)}
.back{align-self:flex-start}
.ytag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .paper .yr{color:var(--seal)}}
:root[data-theme="dark"] .paper .yr{color:var(--seal)}
@media (max-width:420px){.grid{grid-template-columns:repeat(8,1fr)}header img{width:68px;height:68px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const L=["1","2","3","4"];
const $=id=>document.getElementById(id);
const HEAD=$("hd").textContent, SUB=$("sub").textContent;
let cur=null,st=null; // st={order,ans,i}
function shuffle(n){const a=[...Array(n).keys()];for(let k=n-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function key(p){return "gotq_"+p.id}
function load(p){try{const s=JSON.parse(localStorage.getItem(key(p))||"null");if(s&&s.order&&s.order.length===p.q.length&&s.ans.length===p.q.length)return s}catch(e){}return null}
function fresh(p){return{order:shuffle(p.q.length),ans:new Array(p.q.length).fill(null),i:0}}
function save(){try{localStorage.setItem(key(cur),JSON.stringify(st))}catch(e){}}
function stats(p,s){let c=0,w=0;s.ans.forEach((a,k)=>{if(a!==null){a===p.q[s.order[k]].a?c++:w++}});return{c,w}}
function home(){
  cur=null;$("quiz").hidden=true;$("home").hidden=false;window.scrollTo(0,0);
  $("hd").textContent=HEAD;$("sub").textContent=SUB;
  const h=$("home");h.innerHTML='<div class="ytag">Previous papers · year-wise</div>';
  P.forEach(p=>{const b=document.createElement("button");b.type="button";b.className="paper";
    const s=load(p);let info="100 questions · not started";
    if(s){const x=stats(p,s);info=(x.c+x.w)+" / "+p.q.length+" answered · "+x.c+" correct"}
    b.innerHTML='<span class="yr"><small>'+p.mon+'</small>'+p.yr+'</span><span class="info"><div class="nm"></div><div class="st"></div></span><span class="go">Open →</span>';
    b.querySelector(".nm").textContent=p.title;b.querySelector(".st").textContent=info;
    b.onclick=()=>open(p);h.appendChild(b)});
}
function open(p){
  cur=p;st=load(p)||fresh(p);save();
  $("home").hidden=true;$("home").innerHTML="";$("quiz").hidden=false;
  $("hd").textContent=p.title;$("sub").textContent="Govt. Order Test · "+p.q.length+" questions · random order";
  $("tot").textContent=p.q.length;render();window.scrollTo(0,0);try{$("quiz").scrollIntoView({block:"start"})}catch(x){}
}
function render(){
  $("res").hidden=true;$("qcard").hidden=false;
  const i=st.i,q=cur.q[st.order[i]],a=st.ans[i];
  $("qno").textContent="Question "+(i+1);$("qt").textContent=q.q;$("cur").textContent=i+1;
  const o=$("opts");o.innerHTML="";
  q.o.forEach((t,k)=>{const b=document.createElement("button");b.type="button";b.className="opt";
    b.innerHTML='<span class="k">'+L[k]+'</span><span></span>';b.lastChild.textContent=t;
    if(a!==null){b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===a)b.classList.add("bad")}
    b.onclick=()=>{st.ans[i]=k;save();render()};o.appendChild(b)});
  const fb=$("fb");
  if(a===null){fb.textContent="";fb.className="fb"}
  else if(a===q.a){fb.textContent="✓ Correct!";fb.className="fb ok"}
  else{fb.textContent="✗ Wrong. Correct answer: ("+L[q.a]+") "+q.o[q.a];fb.className="fb bad"}
  const s=stats(cur,st);$("sc").textContent=s.c;$("wr").textContent=s.w;
  $("pg").style.width=((s.c+s.w)/cur.q.length*100)+"%";
  $("prev").disabled=i===0;$("next").textContent=i===cur.q.length-1?"Finish":"Next →";
  const g=$("grid");g.innerHTML="";
  st.order.forEach((qi,k)=>{const b=document.createElement("button");b.type="button";b.textContent=k+1;
    if(st.ans[k]!==null)b.className=st.ans[k]===cur.q[qi].a?"ok":"bad";if(k===i)b.classList.add("cur");
    b.onclick=()=>{st.i=k;save();render()};g.appendChild(b)});
}
function result(){
  const s=stats(cur,st);$("qcard").hidden=true;$("res").hidden=false;
  $("rs").textContent=s.c+" / "+cur.q.length;
  const left=cur.q.length-s.c-s.w;
  $("rmsg").textContent=Math.round(s.c/cur.q.length*100)+"% correct · "+s.w+" wrong"+(left?" · "+left+" not answered":"");
}
$("prev").onclick=()=>{if(st.i>0){st.i--;save();render()}};
$("next").onclick=()=>{if(st.i<cur.q.length-1){st.i++;save();render()}else result()};
$("review").onclick=()=>{st.i=0;save();render()};
